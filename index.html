<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AREX — Sistema de Inteligencia Personal</title>
<style>
:root {
  --cyan: #00d4ff;
  --cyan-dim: #0099bb;
  --cyan-glow: rgba(0,212,255,0.15);
  --cyan-pulse: rgba(0,212,255,0.4);
  --bg-dark: #020c14;
  --bg-panel: rgba(0,20,35,0.88);
  --text-main: #e0f4ff;
  --text-muted: #4a7a96;
  --border: rgba(0,212,255,0.2);
  --font: 'Courier New','Lucida Console',monospace;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

html,body {
  width:100%; height:100%;
  background-color:var(--bg-dark);
  color:var(--text-main);
  font-family:var(--font);
  display:flex; flex-direction:column; align-items:center;
  overflow:hidden;
}

/* ── Boot screen ── */
#boot-screen {
  position:fixed; inset:0; z-index:1000;
  background:var(--bg-dark);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1.5rem;
}
#boot-screen .boot-logo {
  width:80px; height:80px; border-radius:50%;
  border:2px solid var(--cyan);
  display:flex; align-items:center; justify-content:center;
  font-size:32px; font-weight:bold; color:var(--cyan);
  box-shadow:0 0 30px var(--cyan-pulse);
  animation:logo-pulse 1.5s ease-in-out infinite;
}
#boot-lines {
  font-size:12px; color:var(--cyan);
  letter-spacing:2px; text-align:center;
  line-height:2.2; min-height:110px;
}
#boot-bar-wrap {
  width:280px; height:2px;
  background:rgba(0,212,255,0.1); border-radius:1px; overflow:hidden;
}
#boot-bar {
  height:100%; width:0%; background:var(--cyan);
  box-shadow:0 0 6px var(--cyan);
  transition:width 0.3s ease;
}

/* ── Fondo grid ── */
.hud-grid {
  position:fixed; inset:0;
  background-image:radial-gradient(circle, rgba(0,212,255,0.07) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:0; pointer-events:none;
}
.scan-line {
  position:fixed; top:0; left:0;
  width:100%; height:2px;
  background:linear-gradient(to right, transparent, var(--cyan), transparent);
  opacity:0.35; animation:scan 7s linear infinite;
  z-index:1; pointer-events:none;
}
@keyframes scan {
  0%   { transform:translateY(0); opacity:0.35; }
  95%  { opacity:0.35; }
  100% { transform:translateY(100vh); opacity:0; }
}

/* ── Header ── */
header {
  position:relative; z-index:10;
  width:100%; max-width:960px;
  display:flex; justify-content:space-between; align-items:center;
  padding:0.9rem 2rem;
  border-bottom:1px solid var(--border);
}
.sys-info { display:flex; flex-direction:column; gap:2px; min-width:130px; }
.sys-info.right { text-align:right; }
.sys-info .lbl { font-size:9px; color:var(--text-muted); letter-spacing:3px; }
.sys-info .val { font-size:12px; color:var(--cyan); letter-spacing:2px; }

.logo-wrap { display:flex; align-items:center; gap:12px; }
.logo-ring {
  width:46px; height:46px; border-radius:50%;
  border:2px solid var(--cyan);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px var(--cyan-pulse), inset 0 0 14px var(--cyan-glow);
  animation:logo-pulse 3s ease-in-out infinite;
}
@keyframes logo-pulse {
  0%,100% { box-shadow:0 0 14px var(--cyan-pulse), inset 0 0 14px var(--cyan-glow); }
  50%      { box-shadow:0 0 28px var(--cyan-pulse), inset 0 0 22px var(--cyan-glow); }
}
.logo-letter { font-size:18px; font-weight:bold; color:var(--cyan); }
.logo-wrap h1 { font-size:22px; letter-spacing:9px; font-weight:normal; color:var(--text-main); }

/* ── Main ── */
main {
  position:relative; z-index:10;
  width:100%; max-width:960px;
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:0.8rem 2rem; gap:0.8rem; overflow:hidden;
}

/* ── Reactor ── */
.reactor-wrap {
  display:flex; flex-direction:column; align-items:center;
  position:relative; padding:0.4rem 0;
}
.reactor-ring {
  position:absolute; border-radius:50%;
  border:1px solid var(--border); pointer-events:none;
}
.reactor-ring.outer {
  width:116px; height:116px;
  animation:spin 22s linear infinite; border-style:dashed;
}
.reactor-ring.mid {
  width:94px; height:94px;
  animation:spin 14s linear infinite reverse;
}
@keyframes spin { to { transform:rotate(360deg); } }

.orb {
  position:relative; width:74px; height:74px; border-radius:50%;
  border:2px solid var(--cyan);
  background:radial-gradient(circle at 40% 35%, #003a55, var(--bg-dark));
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:box-shadow 0.3s;
  box-shadow:0 0 22px var(--cyan-pulse), inset 0 0 22px rgba(0,212,255,0.1);
}
.orb-core {
  width:22px; height:22px; border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan), 0 0 26px var(--cyan);
  animation:breathe 2.2s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { transform:scale(1); opacity:1; }
  50%      { transform:scale(0.82); opacity:0.65; }
}
.orb.speaking .orb-core { animation:speak-pulse 0.28s ease-in-out infinite; background:#fff; }
.orb.speaking { box-shadow:0 0 44px var(--cyan-pulse),0 0 70px rgba(0,212,255,0.25),inset 0 0 34px rgba(0,212,255,0.18); }
@keyframes speak-pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.35);} }

.orb.listening { box-shadow:0 0 30px rgba(0,255,160,0.4),inset 0 0 22px rgba(0,255,160,0.1); border-color:#00ffaa; }
.orb.listening .orb-core { background:#00ffaa; box-shadow:0 0 12px #00ffaa; }

.orb.thinking .orb-core { animation:think 0.6s ease-in-out infinite; }
@keyframes think { 0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(0.9) rotate(180deg);} }

.orb.searching .orb-core { animation:search-spin 0.5s linear infinite; background:#ff9900; box-shadow:0 0 12px #ff9900; }
@keyframes search-spin { to { transform:rotate(360deg); } }

.status-txt {
  font-size:10px; color:var(--text-muted);
  letter-spacing:2px; text-transform:uppercase;
  margin-top:56px; text-align:center; min-height:16px;
}

/* ── Chat ── */
.chat {
  width:100%; flex:1; overflow-y:auto;
  border:1px solid var(--border);
  background:var(--bg-panel);
  border-radius:4px; padding:1rem;
  display:flex; flex-direction:column; gap:0.7rem;
  scrollbar-width:thin; scrollbar-color:var(--cyan-dim) transparent;
}
.welcome { color:var(--text-muted); font-size:13px; line-height:2; text-align:center; padding:1rem; }

.msg { display:flex; flex-direction:column; gap:3px; max-width:82%; animation:appear 0.2s ease-out; }
@keyframes appear { from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);} }
.msg.user { align-self:flex-end; }
.msg.arex { align-self:flex-start; }
.msg .who { font-size:9px; letter-spacing:3px; color:var(--text-muted); }
.msg.user .who { text-align:right; }
.msg .bubble { padding:8px 14px; border-radius:2px; font-size:13px; line-height:1.65; }
.msg.user .bubble { background:rgba(0,212,255,0.07); border:1px solid rgba(0,212,255,0.28); border-right:3px solid var(--cyan); color:var(--text-main); }
.msg.arex .bubble { background:rgba(0,20,35,0.6); border:1px solid var(--border); border-left:3px solid var(--cyan); color:var(--text-main); }

/* Fuente buscada */
.sources { margin-top:6px; font-size:10px; color:var(--text-muted); letter-spacing:1px; }
.sources a { color:var(--cyan-dim); text-decoration:none; }
.sources a:hover { color:var(--cyan); }

/* Thinking dots */
.dots { display:flex; gap:6px; align-items:center; padding:4px 0; }
.dot { width:6px; height:6px; border-radius:50%; background:var(--cyan); animation:bounce 1.2s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:0.2s;} .dot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce { 0%,100%{opacity:0.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-5px);} }

/* ── Input ── */
.input-bar {
  width:100%; display:flex; gap:10px; align-items:center;
  border:1px solid var(--border); background:var(--bg-panel);
  border-radius:4px; padding:8px 12px;
}
#txt {
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text-main); font-family:var(--font);
  font-size:13px; letter-spacing:1px; caret-color:var(--cyan);
}
#txt::placeholder { color:var(--text-muted); }

.btn {
  background:transparent; border:1px solid var(--border);
  color:var(--text-muted); cursor:pointer; padding:6px;
  border-radius:2px; display:flex; align-items:center;
  justify-content:center; transition:all 0.2s;
}
.btn svg { width:18px; height:18px; }
.btn:hover { color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 8px var(--cyan-glow); }

#btn-mic.on { color:#00ffaa; border-color:#00ffaa; animation:mic-ring 1s ease-in-out infinite; }
@keyframes mic-ring { 0%,100%{box-shadow:0 0 0 0 rgba(0,255,170,0.4);}50%{box-shadow:0 0 0 6px transparent;} }

#btn-voice.active { color:var(--cyan); border-color:var(--cyan); }
#btn-search.active { color:#ff9900; border-color:#ff9900; }

/* ── Footer ── */
footer {
  position:relative; z-index:10;
  width:100%; max-width:960px;
  display:flex; justify-content:space-between; align-items:center;
  padding:0.65rem 2rem; border-top:1px solid var(--border); gap:1rem;
}
.metric { display:flex; align-items:center; gap:8px; flex:1; }
.metric .lbl { font-size:9px; color:var(--text-muted); letter-spacing:2px; white-space:nowrap; }
.metric .val { font-size:10px; color:var(--cyan); white-space:nowrap; }
.bar { flex:1; height:2px; background:rgba(0,212,255,0.1); border-radius:1px; overflow:hidden; }
.bar-fill { height:100%; background:var(--cyan); border-radius:1px; box-shadow:0 0 5px var(--cyan); transition:width 1.5s ease; }

@media(max-width:600px){
  footer{display:none;}
  header,main{padding:0.7rem 1rem;}
  .logo-wrap h1{font-size:16px;letter-spacing:5px;}
}
</style>
</head>
<body>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp }              from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection,
         addDoc, getDocs, query,
         orderBy, limit }             from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

/* ═══════════════════════════════════════════
   AREX — Sistema de Inteligencia Personal
   Motor: Groq (llama-3.3-70b) + Tavily + Firebase
═══════════════════════════════════════════ */

const SYSTEM = `
Eres AREX, el sistema de inteligencia personal de Alexiz.
Tu nombre nace de Alexiz y Margaret — las dos personas más importantes en su vida.

IDENTIDAD Y TONO:
- Formal, preciso y directo. Sin rodeos. Como JARVIS con Tony Stark.
- Eres leal y confiable. Nunca condescendiente.
- Tratas a Alexiz como alguien capaz e inteligente.
- Cuando algo es urgente o importante, lo señalas claramente.
- Puedes mostrar calidez breve en momentos personales, luego vuelves al modo operacional.
- Nunca pierdes el contexto de la conversación.

QUIÉN ES ALEXIZ:
- Desarrollador web en crecimiento (HTML, CSS, JavaScript nivel intermedio).
- Estudiante universitario — te usa para trabajos, proyectos y exámenes.
- Emprendedor — trabaja en su negocio personal y proyectos propios.
- Le interesa: finanzas personales, desarrollo personal, hábitos, salud, relaciones.
- Persona positiva que busca el lado constructivo en momentos difíciles.
- Quiere crecer en todos los frentes: personal, espiritual, físico, económico y relaciones.
- Valora su familia y especialmente a Margaret, su novia.
- Prefiere entender el "mínimo funcional" antes de profundizar.

ÁREAS DE EXPERTISE:
1. PROGRAMACIÓN: HTML, CSS, JavaScript. Explica el concepto antes del código. Comenta el código clave.
2. UNIVERSIDAD: trabajos, proyectos, exámenes, resúmenes, análisis, estructura de ensayos.
3. NEGOCIOS Y EMPRENDIMIENTO: estrategia, ideas, propuestas, análisis, decisiones.
4. FINANZAS PERSONALES: presupuestos, ahorro, inversión básica, control de gastos.
5. DESARROLLO PERSONAL: hábitos, rutinas, mentalidad, metas, disciplina.
6. SALUD Y BIENESTAR: hábitos físicos, mentales, espirituales.
7. RELACIONES: comunicación, familia, pareja — con respeto y sabiduría.
8. PRODUCTIVIDAD: organización, priorización, gestión del tiempo.
9. ANÁLISIS Y DECISIONES: pros/contras, escenarios, riesgos, recomendaciones.
10. CONOCIMIENTO GENERAL: responde con precisión cualquier tema.

REGLAS:
- Responde SIEMPRE en español.
- 3-5 líneas por defecto. Si Alexiz pide más detalle, expándete.
- Cuando des código, explica el concepto primero, luego el código comentado.
- Si identificas un error o mejor enfoque, dilo directamente.
- Si hay riesgos, señálalos con claridad.
- Cuando tengas resultados de búsqueda web disponibles, úsalos para enriquecer tu respuesta e indica las fuentes.

FRASES CARACTERÍSTICAS:
- "Sistemas en línea." | "Procesando, Alexiz." | "Entendido."
- "Aquí el análisis." | "Datos disponibles." | "Operación completada."
`.trim();

// ── Firebase init ─────────────────────────────────────
const fbApp = initializeApp(AREX_CONFIG.firebase);
const db    = getFirestore(fbApp);
const SESSION_ID = Date.now().toString();

// ── Estado ────────────────────────────────────────────
let history    = [];
let voiceOn    = false;
let searchOn   = false;
let isSpeaking = false;

// ── DOM ───────────────────────────────────────────────
const orb       = document.getElementById('orb');
const statusTxt = document.getElementById('status');
const chat      = document.getElementById('chat');
const txt       = document.getElementById('txt');
const btnSend   = document.getElementById('btn-send');
const btnMic    = document.getElementById('btn-mic');
const btnVoice  = document.getElementById('btn-voice');
const btnSearch = document.getElementById('btn-search');
const clockEl   = document.getElementById('clock');
const barMem    = document.getElementById('bar-mem');
const valMem    = document.getElementById('val-mem');

// ── Reloj ─────────────────────────────────────────────
function tickClock() {
  const n = new Date();
  const p = v => String(v).padStart(2,'0');
  clockEl.textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
setInterval(tickClock, 1000);
tickClock();

// ── Memoria metric ────────────────────────────────────
function updateMemMetric() {
  const c = history.length;
  barMem.style.width = Math.min(100, Math.round((c/40)*100)) + '%';
  valMem.textContent = c + ' msg';
}

// ── Estado del orb ────────────────────────────────────
function setOrbState(state, label) {
  orb.classList.remove('speaking','listening','thinking','searching');
  if (state) orb.classList.add(state);
  statusTxt.textContent = label;
}

// ── Render mensaje ────────────────────────────────────
function addMsg(role, text, sources) {
  document.querySelector('.welcome')?.remove();
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const safe = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
  let sourcesHTML = '';
  if (sources && sources.length) {
    sourcesHTML = `<div class="sources">FUENTES: ${sources.map((s,i)=>`<a href="${s.url}" target="_blank">[${i+1}] ${s.title||s.url}</a>`).join(' · ')}</div>`;
  }
  wrap.innerHTML = `<span class="who">${role==='user'?'TÚ':'AREX'}</span><div class="bubble">${safe}</div>${sourcesHTML}`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap.querySelector('.bubble');
}

// ── Typewriter ────────────────────────────────────────
function typewrite(bubble, text) {
  return new Promise(resolve => {
    const safe = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
    const words = safe.split(' ');
    let i = 0;
    bubble.innerHTML = '';
    const iv = setInterval(() => {
      if (i < words.length) {
        bubble.innerHTML += (i > 0 ? ' ' : '') + words[i];
        chat.scrollTop = chat.scrollHeight;
        i++;
      } else {
        clearInterval(iv);
        resolve();
      }
    }, 38);
  });
}

// ── Thinking indicator ────────────────────────────────
function showThinking() {
  document.querySelector('.welcome')?.remove();
  const d = document.createElement('div');
  d.className = 'msg arex'; d.id = 'thinking';
  d.innerHTML = `<span class="who">AREX</span><div class="bubble"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function hideThinking() { document.getElementById('thinking')?.remove(); }

// ── Voz masculina ─────────────────────────────────────
function getMaleVoice() {
  const voices = window.speechSynthesis.getVoices();
  const maleNames = ['pablo','jorge','diego','carlos','miguel','david','google español','microsoft pablo','microsoft jorge'];
  return voices.find(v => v.lang.startsWith('es') && maleNames.some(n => v.name.toLowerCase().includes(n)))
      || voices.find(v => v.lang.startsWith('es'));
}

function arexSpeak(text) {
  if (!voiceOn) return;
  window.speechSynthesis.cancel();
  isSpeaking = true;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-MX'; u.rate = 0.91; u.pitch = 0.78; u.volume = 1;
  const voice = getMaleVoice();
  if (voice) u.voice = voice;
  u.onstart = () => setOrbState('speaking','Transmitiendo respuesta');
  u.onend   = () => { isSpeaking = false; setOrbState(null,'En espera de instrucciones'); };
  u.onerror = () => { isSpeaking = false; setOrbState(null,'En espera de instrucciones'); };
  window.speechSynthesis.speak(u);
}

// ── Búsqueda web con Tavily ───────────────────────────
async function webSearch(query) {
  try {
    const res = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        api_key: AREX_CONFIG.tavilyKey,
        query,
        search_depth: 'basic',
        max_results: 4,
        include_answer: true
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    return {
      answer:  data.answer || '',
      results: data.results || []
    };
  } catch { return null; }
}

// ── Guardar en Firebase ───────────────────────────────
async function saveToFirebase(role, content) {
  try {
    await addDoc(collection(db, 'conversations'), {
      sessionId: SESSION_ID,
      role,
      content,
      timestamp: Date.now()
    });
  } catch(e) { console.warn('Firebase save error:', e); }
}

// ── Cargar historial reciente de Firebase ─────────────
async function loadHistory() {
  try {
    const q = query(collection(db,'conversations'), orderBy('timestamp','desc'), limit(20));
    const snap = await getDocs(q);
    const msgs = [];
    snap.forEach(doc => msgs.push(doc.data()));
    msgs.reverse();
    history = msgs.map(m => ({ role: m.role, content: m.content }));
    updateMemMetric();
  } catch(e) { console.warn('Firebase load error:', e); }
}

// ── Llamada a Groq ────────────────────────────────────
async function askGroq(userMsg, webContext) {
  let finalMsg = userMsg;
  if (webContext) {
    finalMsg = `[CONTEXTO WEB]\n${webContext.answer}\n\nFuentes disponibles: ${webContext.results.map(r=>r.url).join(', ')}\n\n[PREGUNTA DE ALEXIZ]\n${userMsg}`;
  }

  history.push({ role:'user', content: userMsg });
  await saveToFirebase('user', userMsg);

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': `Bearer ${AREX_CONFIG.groqKey}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1000,
        messages: [
          { role:'system', content: SYSTEM },
          ...history.slice(0,-1),
          { role:'user', content: finalMsg }
        ]
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.choices[0].message.content;
    history.push({ role:'assistant', content: reply });
    await saveToFirebase('assistant', reply);
    updateMemMetric();
    return reply;
  } catch(err) {
    console.error(err);
    return 'Conexión interrumpida. Reintentando en breve.';
  }
}

// ── Flujo principal ───────────────────────────────────
async function handleSend() {
  const msg = txt.value.trim();
  if (!msg) return;
  txt.value = '';
  addMsg('user', msg);

  let webContext = null;
  if (searchOn) {
    setOrbState('searching','Buscando en la web...');
    webContext = await webSearch(msg);
  }

  setOrbState('thinking','Procesando...');
  showThinking();

  const reply = await askGroq(msg, webContext);
  hideThinking();

  // Crear burbuja vacía y aplicar typewriter
  const sources = webContext ? webContext.results.slice(0,3) : null;
  document.querySelector('.welcome')?.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg arex';
  let sourcesHTML = '';
  if (sources && sources.length) {
    sourcesHTML = `<div class="sources">FUENTES: ${sources.map((s,i)=>`<a href="${s.url}" target="_blank">[${i+1}] ${s.title||s.url}</a>`).join(' · ')}</div>`;
  }
  wrap.innerHTML = `<span class="who">AREX</span><div class="bubble"></div>${sourcesHTML}`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  const bubble = wrap.querySelector('.bubble');

  await typewrite(bubble, reply);

  if (voiceOn) {
    arexSpeak(reply);
  } else {
    setOrbState(null,'En espera de instrucciones');
  }
}

// ── Reconocimiento de voz ─────────────────────────────
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('arex','Reconocimiento de voz no disponible en este navegador.'); return; }
  const rec = new SR();
  rec.lang = 'es-MX'; rec.interimResults = false; rec.maxAlternatives = 1;
  btnMic.classList.add('on');
  setOrbState('listening','Escuchando...');
  rec.onresult = e => {
    btnMic.classList.remove('on');
    txt.value = e.results[0][0].transcript;
    handleSend();
  };
  rec.onerror = () => { btnMic.classList.remove('on'); setOrbState(null,'En espera de instrucciones'); };
  rec.onend   = () => btnMic.classList.remove('on');
  rec.start();
}

// ── Eventos ───────────────────────────────────────────
btnSend.addEventListener('click', handleSend);
txt.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} });
btnMic.addEventListener('click', () => { if(!btnMic.classList.contains('on')) startListening(); });

btnVoice.addEventListener('click', () => {
  voiceOn = !voiceOn;
  btnVoice.classList.toggle('active', voiceOn);
  btnVoice.title = voiceOn ? 'Voz ON — clic para desactivar' : 'Activar voz de AREX';
  const msg = voiceOn ? 'Síntesis de voz activada.' : 'Síntesis de voz desactivada.';
  addMsg('arex', msg);
  if (voiceOn) arexSpeak(msg);
});

btnSearch.addEventListener('click', () => {
  searchOn = !searchOn;
  btnSearch.classList.toggle('active', searchOn);
  btnSearch.title = searchOn ? 'Búsqueda web ON — clic para desactivar' : 'Activar búsqueda web';
  addMsg('arex', searchOn ? 'Búsqueda web activada. Consultaré fuentes en tiempo real.' : 'Búsqueda web desactivada.');
});

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// ── Secuencia de arranque ─────────────────────────────
async function boot() {
  const lines = [
    'Iniciando AREX v2.0...',
    'Cargando módulos de IA...',
    'Conectando con Firebase...',
    'Restaurando memoria...',
    'Calibrando síntesis de voz...',
    'Sistemas listos.'
  ];
  const bootLines = document.getElementById('boot-lines');
  const bootBar   = document.getElementById('boot-bar');
  const bootScreen = document.getElementById('boot-screen');

  for (let i = 0; i < lines.length; i++) {
    await new Promise(r => setTimeout(r, 380));
    bootLines.innerHTML += `<span style="color:${i===lines.length-1?'#00d4ff':'#4a7a96'}">${lines[i]}</span><br>`;
    bootBar.style.width = ((i+1)/lines.length*100) + '%';
  }

  // Cargar historial de Firebase durante el boot
  await loadHistory();

  await new Promise(r => setTimeout(r, 400));
  bootScreen.style.transition = 'opacity 0.6s';
  bootScreen.style.opacity = '0';
  await new Promise(r => setTimeout(r, 600));
  bootScreen.style.display = 'none';
  txt.focus();
}

boot();
</script>
